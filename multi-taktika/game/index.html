<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Taktika</title>
<style>
  :root {
    --bg: #14100c;
    --bg2: #1d1811;
    --panel: #26200f;
    --line: #4a3a1e;
    --gold: #e0b34a;
    --gold-dim: #a88530;
    --text: #e8ded0;
    --text-dim: #a89b89;
    --green: #7cb342;
    --red: #c0562f;
    --blue: #4a7fb5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    font-size: 16px;
  }
  #app { position: relative; width: 100vw; height: 100vh; }
  #field { position: absolute; inset: 0; display: block; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #overlay > * { pointer-events: auto; }
  #boot {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    padding: 0 20px;
  }
  #boot .logo { font-size: 20px; font-weight: 700; letter-spacing: .08em; color: var(--gold); }
  #boot .msg { font-size: 16px; color: var(--text-dim); }
</style>
</head>
<body>
<div id="app">
  <canvas id="field"></canvas>
  <div id="overlay">
    <div id="boot">
      <span class="logo">MULTI-TAKTIKA</span>
      <span class="msg">起動中…</span>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
