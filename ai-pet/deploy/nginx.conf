# 『ぽこもふ島』Nginx 設定（deploy/README.md 参照）
#
# 役割:
#   /        → Viteのビルド成果物を静的配信
#   /ws      → WebSocketをゲームサーバへプロキシ
#   /healthz → 死活監視
#
# certbot --nginx を実行すると TLS の設定行がこのファイルに追記される。

upstream pokomofu_app {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name pokomofu.example.com;   # ← ドメインに置き換える

    # 静的ファイル（クライアント）
    root /srv/pokomofu/app/ai-pet/packages/client/dist;
    index index.html;

    # gzip。js+css+html で 186KB → 転送量を大きく削る
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ハッシュ付きのバンドルは長期キャッシュ
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html はキャッシュしない（デプロイ直後に古いバンドルを掴ませない）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- WebSocket ---
    # 4Hzで delta が流れるので実際には無通信にならないが、余裕を持たせる
    location /ws {
        proxy_pass http://pokomofu_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # ゲームの応答性を落とさないため、プロキシのバッファを無効化する
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://pokomofu_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # /metrics は外に出さない（本番では NODE_ENV=production で無効だが二重に塞ぐ）
    location = /metrics {
        return 404;
    }

    client_max_body_size 1m;
}
