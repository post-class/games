<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ぽこもふ島</title>

<link rel="stylesheet" href="/src/ui/style.css">
</head>
<body>
  <div id="game"></div>

  <div id="hud" class="hud">

  <div id="boot" class="boot" data-testid="boot-overlay">
    <p class="boot-title">ぽこもふ島</p>
    <p class="boot-sub" id="boot-msg" data-testid="boot-msg">島にわたっています…</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
