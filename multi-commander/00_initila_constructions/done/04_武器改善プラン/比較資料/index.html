<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>武器改善プラン | 改善前後比較</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #151d32;
        --panel-2: #1b2640;
        --line: #354361;
        --text: #eef3ff;
        --muted: #9eabc5;
        --accent: #7dd3fc;
        --accent-2: #c4b5fd;
        --success: #86efac;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at top, #17213c 0, var(--bg) 52rem);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      main { max-width: 1440px; margin: 0 auto; padding: 32px 24px 64px; }
      h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 40px); }
      h2 { margin: 0; font-size: 20px; }
      h3 { margin: 0 0 10px; font-size: 15px; color: var(--muted); }
      p { color: var(--muted); }
      .lead { max-width: 940px; margin: 0 0 22px; }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin: 0 0 24px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(11, 16, 32, .92);
        backdrop-filter: blur(12px);
      }
      button {
        border: 1px solid #6380b5;
        border-radius: 9px;
        padding: 9px 14px;
        color: #08101e;
        background: var(--accent);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
      button:hover { filter: brightness(1.12); }
      button.secondary { color: var(--text); background: var(--panel-2); }
      #copy-status { min-height: 1.5em; color: var(--success); }
      .weapons { display: grid; gap: 18px; }
      .weapon-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: linear-gradient(145deg, rgba(27, 38, 64, .98), rgba(17, 24, 43, .98));
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }
      .kind { margin-left: 8px; color: var(--muted); font-size: 13px; font-weight: 400; }
      .choices { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .choices span { color: var(--muted); font-size: 13px; }
      .choice {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(10, 15, 30, .6);
        cursor: pointer;
        color: var(--text);
        font-size: 13px;
      }
      .choice:has(input:checked) { border-color: var(--accent); background: rgba(125, 211, 252, .16); }
      .choice input { accent-color: var(--accent); }
      .copy-one { padding: 6px 10px; font-size: 12px; }
      .card-body { padding: 18px; }
      .comparison {
        display: grid;
        grid-template-columns: minmax(280px, 1fr) minmax(280px, 1fr);
        gap: 16px;
      }
      .compare-panel {
        min-width: 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(7, 12, 25, .46);
      }
      .after-panel { border-color: rgba(125, 211, 252, .52); }
      .panel-label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .panel-label strong { color: var(--accent); }
      .panel-label small { color: var(--muted); }
      .graphic {
        display: block;
        width: 100%;
        aspect-ratio: 2 / 1;
        border: 1px solid #2b3958;
        border-radius: 8px;
        background: #0a1020;
        object-fit: contain;
      }
      audio { display: block; width: 100%; margin-top: 10px; }
      .missing {
        display: grid;
        place-items: center;
        min-height: 78px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        font-size: 13px;
      }
      .candidate-note { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
      .selection-output {
        width: 100%;
        min-height: 110px;
        margin-top: 20px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: #dbeafe;
        background: #080d1b;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        resize: vertical;
      }
      @media (max-width: 760px) {
        main { padding: 22px 12px 48px; }
        .comparison { grid-template-columns: 1fr; }
        .card-head { align-items: flex-start; }
        .copy-one { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>武器改善プラン：改善前後比較</h1>
      <p class="lead">
        各武器の改善前と、改善後候補A/B/Cを比較できます。ラジオボタンを切り替えると、右側のグラフィックと音声が連動します。
        選択はブラウザに保存され、下のボタンから採用候補をクリップボードへコピーできます。
      </p>

      <div class="toolbar">
        <button id="copy-all" type="button">全武器の選択値をクリップボードへコピー</button>
        <button id="reset-all" class="secondary" type="button">全てAに戻す</button>
        <span id="copy-status" role="status" aria-live="polite"></span>
      </div>

      <section id="weapons" class="weapons" aria-label="武器別比較"></section>
      <textarea id="selection-output" class="selection-output" readonly aria-label="選択値のプレビュー"></textarea>
    </main>

    <script>
      const weapons = [
        ['laser', 'レーザー砲', '主砲・既存', true],
        ['mass-driver', 'マスドライバー', '主砲・既存', true],
        ['neutron-gun', 'ニュートロンガン', '主砲・既存', true],
        ['particle-cannon', 'パーティクルキャノン', '主砲・既存', true],
        ['dumbfire', 'ダムファイア', 'ミサイル・既存', true],
        ['heat-seeker', 'ヒートシーカー', 'ミサイル・既存', true],
        ['image-rec', 'イメージレコグニション', 'ミサイル・既存', true],
        ['torpedo', '対艦魚雷', 'ミサイル・既存', true],
        ['pulse-cannon', 'パルスキャノン', '主砲・追加', false],
        ['ion-lance', 'イオンランス', '主砲・追加', false],
        ['shield-breaker', 'シールドブレイカー', 'ミサイル・追加', false],
        ['armor-breacher', 'アーマーブリーチャー', 'ミサイル・追加', false],
      ];
      const candidates = {
        A: '基準プロファイル',
        B: '機械・金属の実機感',
        C: '推進・圧力の実機感',
      };
      const basePath = './';
      const saved = JSON.parse(localStorage.getItem('weapon-comparison-selection') || '{}');
      const selections = Object.fromEntries(weapons.map(([id]) => [id, saved[id] || 'A']));
      const container = document.querySelector('#weapons');
      const output = document.querySelector('#selection-output');
      const status = document.querySelector('#copy-status');

      function beforeAudio(id, hasBefore) {
        return hasBefore ? `${basePath}${id}/01_before-audio.wav` : '';
      }
      function beforeGraphic(id, hasBefore) {
        return `${basePath}${id}/${hasBefore ? '01_before-graphic.svg' : '01_before-not-implemented.svg'}`;
      }
      function afterAudio(id, candidate) {
        return `${basePath}${id}/03_after-${candidate === 'A' ? '1' : candidate === 'B' ? '2' : '3'}-audio.wav`;
      }
      function afterGraphic(id, candidate) {
        return `${basePath}${id}/03_after-${candidate === 'A' ? '1' : candidate === 'B' ? '2' : '3'}-graphic.svg`;
      }
      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      }

      function cardTemplate([id, name, kind, hasBefore]) {
        const selected = selections[id];
        const beforeAudioPath = beforeAudio(id, hasBefore);
        return `<article class="weapon-card" data-id="${id}">
          <header class="card-head">
            <h2>${escapeHtml(name)}<span class="kind">${escapeHtml(kind)}</span></h2>
            <div class="choices" role="radiogroup" aria-label="${escapeHtml(name)}の改善後候補">
              <span>改善後:</span>
              ${Object.entries(candidates).map(([key, label]) => `<label class="choice"><input type="radio" name="candidate-${id}" value="${key}" ${selected === key ? 'checked' : ''}>${key} <small>${label}</small></label>`).join('')}
              <button class="copy-one secondary" type="button" data-copy-one="${id}">この武器をコピー</button>
            </div>
          </header>
          <div class="card-body">
            <div class="comparison">
              <section class="compare-panel">
                <div class="panel-label"><strong>改善前</strong><small>${hasBefore ? 'ベースライン' : '以前は未実装'}</small></div>
                <img class="graphic" src="${beforeGraphic(id, hasBefore)}" alt="${escapeHtml(name)} 改善前グラフィック">
                ${beforeAudioPath ? `<audio controls preload="none" src="${beforeAudioPath}" aria-label="${escapeHtml(name)} 改善前音声"></audio>` : '<div class="missing">以前の音声は未実装</div>'}
              </section>
              <section class="compare-panel after-panel">
                <div class="panel-label"><strong>改善後候補 <span data-selected-label>${selected}</span></strong><small data-candidate-name>${candidates[selected]}</small></div>
                <img class="graphic" data-after-graphic src="${afterGraphic(id, selected)}" alt="${escapeHtml(name)} 改善後候補${selected}グラフィック">
                <audio controls preload="auto" data-after-audio src="${afterAudio(id, selected)}" aria-label="${escapeHtml(name)} 改善後候補${selected}音声"></audio>
                <p class="candidate-note">候補A: 基準 / 候補B: 機械・金属 / 候補C: 推進・圧力</p>
              </section>
            </div>
          </div>
        </article>`;
      }

      function selectionText() {
        return JSON.stringify(Object.fromEntries(weapons.map(([id, name]) => [id, { name, candidate: selections[id], label: candidates[selections[id]] }])), null, 2);
      }

      function saveAndRenderOutput() {
        localStorage.setItem('weapon-comparison-selection', JSON.stringify(selections));
        output.value = selectionText();
      }

      function updateCard(card, candidate) {
        const id = card.dataset.id;
        card.querySelector('[data-selected-label]').textContent = candidate;
        card.querySelector('[data-candidate-name]').textContent = candidates[candidate];
        card.querySelector('[data-after-graphic]').src = afterGraphic(id, candidate);
        card.querySelector('[data-after-graphic]').alt = `${id} 改善後候補${candidate}グラフィック`;
        const audio = card.querySelector('[data-after-audio]');
        audio.pause();
        audio.currentTime = 0;
        audio.src = afterAudio(id, candidate);
        audio.load();
        // ラジオボタン操作はユーザー操作内なので、候補変更時は再生ボタン不要で試聴を開始する。
        void audio.play().catch(() => {
          // ブラウザの自動再生制限や音声デバイスの問題でも、UI操作自体は継続する。
        });
      }

      function render() {
        container.innerHTML = weapons.map(cardTemplate).join('');
        container.querySelectorAll('input[type="radio"]').forEach((input) => {
          input.addEventListener('change', () => {
            const id = input.name.replace('candidate-', '');
            selections[id] = input.value;
            updateCard(input.closest('.weapon-card'), input.value);
            saveAndRenderOutput();
          });
        });
        container.querySelectorAll('[data-copy-one]').forEach((button) => {
          button.addEventListener('click', () => copyText(JSON.stringify({ [button.dataset.copyOne]: { candidate: selections[button.dataset.copyOne], label: candidates[selections[button.dataset.copyOne]] } }, null, 2), `${button.dataset.copyOne} の選択値をコピーしました`));
        });
        saveAndRenderOutput();
      }

      async function copyText(text, message) {
        status.textContent = message;
        let copied = false;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            copied = true;
          }
        } catch {
          copied = false;
        }
        if (!copied) {
          try {
          const helper = document.createElement('textarea');
          helper.value = text;
          helper.style.position = 'fixed';
          helper.style.opacity = '0';
          document.body.appendChild(helper);
          helper.select();
          document.execCommand('copy');
          helper.remove();
          } catch {
            // Clipboard API と旧式フォールバックの両方が拒否されても、選択値は下の textarea から取得できる。
          }
        }
        window.setTimeout(() => { status.textContent = ''; }, 2600);
      }

      document.querySelector('#copy-all').addEventListener('click', () => copyText(selectionText(), '全武器の選択値をコピーしました'));
      document.querySelector('#reset-all').addEventListener('click', () => {
        weapons.forEach(([id]) => { selections[id] = 'A'; });
        render();
        status.textContent = '全てAに戻しました';
      });
      render();
    </script>
  </body>
</html>
